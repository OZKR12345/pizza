<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>¿Te gusta la pizza?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      font-family: 'Arial', sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      position: relative;

      background-image: url("https://img.freepik.com/vector-premium/fondo-patron-dibujos-animados-pizza_147069-1285.jpg?semt=ais_hybrid&w=740");

    }

    h1 {
      font-size: 2.5em;
      color: #d24d00;
      text-align: center;
      z-index: 2;
    }

    .btn {
      background-color: #ff6600;
      border: none;
      color: white;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      z-index: 2;
    }

    .btn:hover {
      background-color: #cc5200;
      transform: scale(1.1);
    }

    .pizza {
      position: absolute;
      top: 10px;
      width: 50px;
      height: 50px;
      background-image: url('https://www.svgrepo.com/show/295415/breakfast.svg');

      background-size: contain;
      background-repeat: no-repeat;
      animation: floatPizza linear infinite;
      opacity: 0.8;
      z-index: -99;
    }

    @keyframes floatPizza {
      0% {
        transform: translateY(-100px) rotate(0deg);
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .vol {

      display: none;
    }

    @media only screen and (min-width: 100px) {
      .titulo {
        font-size: 100px;
      }
    }
  </style>
</head>

<body>

  <h1 class="titulo">¿Te gusta la pizza?</h1>
  <button class="btn" onclick="location.href='https://www.youtube.com/watch?v=QnBImh4D4zI'">Sí 🍕</button>
  <button class="btn" onclick="location.href='https://www.youtube.com/watch?v=dQw4w9WgXcQ'">No 😢</button>

  <div id="pizza" class="pizza"></div>


  <ul id="vol" class="vol"></ul>




  <script>
    for (let i = 0; i < 26; i++) {
      const pizza = document.querySelector(".pizza");
      pizza.classList.add('pizza');


      const node = document.createElement("li");
      const textnode = document.createElement("div");
      textnode.classList.add('pizza');
      node.appendChild(textnode);
      document.getElementById("vol").appendChild(node);


      pizza.style.left = Math.random() * 100 + 'vw';
      pizza.style.animationDuration = (5 + Math.random() * 10) + 's';
      // pizza.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(pizza);
    }
  </script>

</body>

</html>
