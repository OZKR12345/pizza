<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>Cesia Abigahil Sec Paredes ¿Quieres ser mi novia?</title>
  
  <style>
    
    

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
	  position: relative;
	
    background-image: url("https://i.pinimg.com/736x/b6/4b/ed/b64bedd4bf43731b5676e171f8771ecd.jpg");
	  
    }

    h1 {
      font-size: 2.5em;
      color: #f4e222;
      text-align: center;
      z-index: 2;
    }

    .btn {
      background-color: #ff2002;
      border: none;
      color: white;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 2s, transform 2s;
      z-index: 2;
    }

    .btn:hover {
      background-color: #e73a00;
      transform: scale(1.1);
    }

    .pizza {
      position: absolute;
	  top: 30px;
      width: 60px;
      height: 60px;
      background-image: url('https://static.wikia.nocookie.net/doblaje/images/8/81/Pompompurin.png/revision/latest?cb=20230927030529&path-prefix=es'); 
	  
      background-size: contain; 
      background-repeat: no-repeat;
      animation: floatPizza linear infinite;
      opacity: 0.8;
      z-index: -99;
    }

    @keyframes floatPizza {
      0% {
        transform: translateY(-100px) rotate(0deg);
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
      }
    }
	
	.vol {
		
		display: none;
	}
	
	@media only screen and (min-width: 100px) {
  .titulo {
    font-size: 100px;
  }
}
  </style>
</head>
<body>

    <h1 class="titulo">Cesia Abigahil Sec Paredes ¿Quieres ser mi novia?</h1>
    
      </style>
  <button class="btn" onclick="location.href='https://youtube.com/shorts/uB6XQbKYjFA'">Sí 👉👈 </button>
  <button class="btn" onclick="location.href='https://youtube.com/shorts/JC9p1xUOBdY'">No 💩</button>
	
	<div id="pizza" class="pizza"></div>
	
	
	<ul id="vol" class="vol"></ul>
		
  
	
	
  <script>
    for (let i = 0; i < 26; i++) {
      const pizza = document.querySelector(".pizza");
      pizza.classList.add('pizza');
	  
	  
	  const node = document.createElement("li");
const textnode = document.createElement("div");
textnode.classList.add('pizza');
node.appendChild(textnode);
document.getElementById("vol").appendChild(node);
	  
	  
      pizza.style.left = Math.random() * 100 + 'vw';
      pizza.style.animationDuration = (5 + Math.random() * 10) + 's';
      // pizza.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(pizza);
    }
  </script>

</body>
</html>
